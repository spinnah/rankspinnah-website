<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RankSpinnah</title>
<link rel="icon" href="assets/img/rankspinnah-appicon-dark.png">

<style>
  :root {
    color-scheme: light dark;
  }

  body {
    font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #111827;
  }

  @media (prefers-color-scheme: dark) {
    body {
      background: #050816;
      color: #e5e7eb;
    }
  }

  .wrap {
    max-width: 1040px;
    margin: 4rem auto 5rem;
    padding: 0 1.5rem;
    text-align: center;
  }

  header h1 {
    font-size: clamp(2.25rem, 4vw, 2.75rem);
    margin: 0 0 0.5rem;
  }

  header p.lead {
    font-size: 1.125rem;
    opacity: 0.9;
    margin: 0 0 1.5rem;
  }

  .app-icon {
    margin-bottom: 1.5rem;
  }

  .app-icon img {
    width: 120px;
    height: 120px;
    border-radius: 24px;
  }

  .hero-img {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto 2rem;
    display: block;
    border-radius: 16px;
  }

  .badges {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  .badges img {
    height: 48px;
  }

  .meta {
    font-size: 0.9rem;
    opacity: 0.8;
    margin-top: 0.5rem;
  }

  footer {
    margin-top: 2.5rem;
    font-size: 0.85rem;
    opacity: 0.7;
    text-align: center;
  }

  footer a {
    color: inherit;
    text-decoration: none;
    margin: 0 0.5rem;
  }

  footer a:hover {
    text-decoration: underline;
  }
</style>

<body>
  <div class="wrap">
    <header>
      <div class="app-icon">
        <picture>
          <!-- Light mode: dark icon on light background -->
          <source srcset="assets/img/rankspinnah-appicon-dark.png"
                  media="(prefers-color-scheme: light)">
          <!-- Dark mode: light/default icon on dark background -->
          <source srcset="assets/img/rankspinnah-appicon-default.png"
                  media="(prefers-color-scheme: dark)">
          <img src="assets/img/rankspinnah-appicon-dark.png" alt="RankSpinnah app icon">
        </picture>
      </div>

      <h1>RankSpinnah</h1>
      <p class="lead">Build, rank, and share your lists across iPhone, iPad, and Mac.</p>
    </header>

    <main>
      <!-- Hero image -->
      <img
        src="assets/img/hero-rankspinnah.webp"
        alt="RankSpinnah on iPhone, iPad, and iMac"
        class="hero-img"
        width="2400" height="1400"
      >

      <!-- App Store badge (light/dark aware, centralized asset) -->
      <div class="badges">
        <a href="https://apple.co/3KdJs7O" target="_blank" rel="noopener noreferrer">
          <picture>
            <!-- Dark mode: white badge on dark background -->
            <source srcset="https://spinnah.app/assets/img/Download_on_the_App_Store_Badge_US-UK_RGB_wht_092917.svg"
                    media="(prefers-color-scheme: dark)">
            <!-- Light mode: black badge on light background -->
            <source srcset="https://spinnah.app/assets/img/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg"
                    media="(prefers-color-scheme: light)">
            <img
              src="https://spinnah.app/assets/img/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg"
              alt="Download RankSpinnah on the App Store">
          </picture>
        </a>
      </div>

      <p class="meta">One universal purchase. Use RankSpinnah on iPhone, iPad, and Mac with a single download.</p>
    </main>

    <footer>
      <p>© <span id="year"></span> Spinnah. Published by ShastLeLow.</p>
      <nav>
        <a href="https://spinnah.app/privacy.html">Privacy</a>
        <a href="https://spinnah.app/support.html">Support</a>
        <a href="mailto:info@spinnah.app">Contact</a>
      </nav>
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
